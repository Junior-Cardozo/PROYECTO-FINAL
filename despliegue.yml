services:
  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: monitor-api
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Authentication__Twitch__ClientId: ${TWITCH_CLIENT_ID}
      Authentication__Twitch__ClientSecret: ${TWITCH_CLIENT_SECRET}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Authentication__Discord__ClientId: ${DISCORD_CLIENT_ID}
      Authentication__Discord__ClientSecret: ${DISCORD_CLIENT_SECRET}
      Authentication__Spotify__ClientId: ${SPOTIFY_CLIENT_ID}
      Authentication__Spotify__ClientSecret: ${SPOTIFY_CLIENT_SECRET}
      Authentication__Dropbox__ClientId: ${DROPBOX_CLIENT_ID}
      Authentication__Dropbox__ClientSecret: ${DROPBOX_CLIENT_SECRET}
      Authentication__Slack__ClientId: ${SLACK_CLIENT_ID}
      Authentication__Slack__ClientSecret: ${SLACK_CLIENT_SECRET}
      DROPBOX_REDIRECT_URI: ${DROPBOX_REDIRECT_URI}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI}
      Authentication__TikTok__ClientKey: ${TIKTOK_CLIENT_KEY}
      Authentication__TikTok__ClientSecret: ${TIKTOK_CLIENT_SECRET}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitor_red
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: monitor-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - monitor_red
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: monitor-final-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - monitor_red
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitor-final-node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /:/host:ro
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/run/user($|/)"
    networks:
      - monitor_red
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:

networks:
  monitor_red:
    driver: bridge
