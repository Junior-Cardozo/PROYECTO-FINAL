# Configuración de Prometheus.
# Cada 15 s "visita" (scrape) los objetivos de abajo y guarda sus métricas.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus se monitorea a sí mismo
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Node Exporter: CPU, RAM, disco y uptime del servidor Linux
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          servidor: "host-docker"
